name: Build launcher APK

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp launcher/app/build/outputs/apk/release/*.apk out/cleanyourtv-launcher.apk
          ls -la out

      - name: Keep as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-launcher
          path: out/cleanyourtv-launcher.apk

      - name: Publish as a release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-build-${{ github.run_number }}
          name: CleanYourTV launcher build ${{ github.run_number }}
          body: Built from ${{ github.sha }}. Sideload with aTV Tools.
          files: out/cleanyourtv-launcher.apk
